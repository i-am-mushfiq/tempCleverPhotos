name: AlbumCurator
options:
  bundleIdPrefix: com.example
  xcodeVersion: "15.4"
  objectVersion: 56
  deploymentTarget:
    iOS: "17.0"

targets:
  AlbumCurator:
    type: application
    platform: iOS
    sources:
      - path: Sources/AlbumCuratorApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Album Curator requires access to your Photo Library to scan, group, and manage your photo albums."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Album Curator requires permission to save organized photo albums to your Photo Library."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AlbumCurator
        PRODUCT_NAME: AlbumCurator
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
