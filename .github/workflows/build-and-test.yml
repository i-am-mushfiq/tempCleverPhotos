name: Build & Test Album Curator (iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Select Xcode 15.4
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Run XCTest Suite (iOS Simulator)
      run: |
        # `swift test` runs against the macOS host toolchain, where UIKit is unavailable
        # (two source files import it) so the package doesn't even compile there. Instead,
        # build+run the real XCTest suite against the iOS Simulator SDK directly against
        # Package.swift (xcodebuild auto-generates a scheme named after the package when
        # invoked with no -project/-workspace). This is the actual test gate — if a test
        # fails to compile or fails an assertion, this step fails the job.
        xcodebuild test \
          -scheme AlbumCurator \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -derivedDataPath .build/testDerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          | tail -200

    - name: Generate Xcode Project & Patch Compatibility
      run: |
        xcodegen generate
        sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/g' AlbumCurator.xcodeproj/project.pbxproj

    - name: Verify App Target Compiles (iOS Simulator SDK)
      run: |
        xcodebuild build \
          -project AlbumCurator.xcodeproj \
          -scheme AlbumCurator \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          -derivedDataPath .build/simDerivedData \
          | tail -5

    - name: Build Native iOS App Bundle via xcodebuild
      run: |
        xcodebuild -project AlbumCurator.xcodeproj -scheme AlbumCurator -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath .build/derivedData

    - name: Verify Safety Invariant (No Asset Deletion API)
      run: |
        echo "Verifying safety invariant: PHAssetChangeRequest.deleteAssets must never be called."
        if grep -rn "deleteAssets" Sources/ ; then
          echo "ERROR: deleteAssets API call detected! Non-destructive policy violated."
          exit 1
        else
          echo "SUCCESS: Non-destructive architectural invariant verified."
        fi

    - name: Verify Real Vision Engine Is Wired
      run: |
        echo "Verifying VNGenerateImageFeaturePrintRequest is present (real AI, not fake engine)."
        if ! grep -rn "VNGenerateImageFeaturePrintRequest" Sources/ ; then
          echo "ERROR: Real Vision analysis not found — fake engine may have been reverted."
          exit 1
        else
          echo "SUCCESS: VNGenerateImageFeaturePrintRequest confirmed in codebase."
        fi

    - name: Create IPA Package
      run: |
        rm -rf Payload AlbumCurator-iOS.ipa
        mkdir -p Payload
        cp -R .build/derivedData/Build/Products/Release-iphoneos/AlbumCurator.app Payload/
        zip -r AlbumCurator-iOS.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: AlbumCurator-IPA-unsigned
        path: AlbumCurator-iOS.ipa
        retention-days: 7
