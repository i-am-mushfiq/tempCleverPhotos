name: Build & Test Album Curator (iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Select Xcode 15.4
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Run XCTest Suite (iOS Simulator)
      run: |
        # `swift test` runs against the macOS host toolchain, where UIKit is unavailable
        # (two source files import it) so the package doesn't even compile there. Instead,
        # build+run the real XCTest suite against the iOS Simulator SDK directly against
        # Package.swift (xcodebuild auto-generates a scheme named after the package when
        # invoked with no -project/-workspace). This is the actual test gate — if a test
        # fails to compile or fails an assertion, this step fails the job.
        xcodebuild test \
          -scheme AlbumCurator \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -derivedDataPath .build/testDerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          | tail -200

    - name: Generate Xcode Project & Patch Compatibility
      run: |
        xcodegen generate
        sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/g' AlbumCurator.xcodeproj/project.pbxproj

    - name: Verify App Target Compiles (iOS Simulator SDK)
      run: |
        xcodebuild build \
          -project AlbumCurator.xcodeproj \
          -scheme AlbumCurator \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          -derivedDataPath .build/simDerivedData \
          | tail -5

    - name: Import Code-Signing Certificate & Provisioning Profile
      id: import_signing
      if: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 != '' && secrets.IOS_DIST_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
      env:
        CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      run: |
        # Optional path: only runs when a personal Apple Developer certificate +
        # provisioning profile have been added as repo secrets. Without these secrets
        # (the default for anyone forking this repo), the pipeline falls back to
        # producing an UNSIGNED .ipa further down — see README for the required
        # secret names if you want CI to hand you an installable, signed build.
        CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
        PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
        KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
        EFFECTIVE_KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-ci-ephemeral-$GITHUB_RUN_ID}"

        echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
        echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

        security create-keychain -p "$EFFECTIVE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$EFFECTIVE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
        security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$EFFECTIVE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
        cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/

        echo "configured=true" >> "$GITHUB_OUTPUT"

    - name: Build Native iOS App Bundle via xcodebuild
      env:
        DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      run: |
        if [ "${{ steps.import_signing.outputs.configured }}" = "true" ]; then
          echo "Signing secrets present — building a SIGNED release IPA."
          xcodebuild -project AlbumCurator.xcodeproj -scheme AlbumCurator -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            -derivedDataPath .build/derivedData
          echo "IPA_SIGNED=true" >> "$GITHUB_ENV"
        else
          echo "No signing secrets configured — building an UNSIGNED release IPA."
          echo "You must re-sign it yourself (e.g. via Sideloadly + a personal Apple ID) before it can be installed on a device."
          xcodebuild -project AlbumCurator.xcodeproj -scheme AlbumCurator -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath .build/derivedData
          echo "IPA_SIGNED=false" >> "$GITHUB_ENV"
        fi

    - name: Verify Safety Invariant (No Asset Deletion API)
      run: |
        echo "Verifying safety invariant: PHAssetChangeRequest.deleteAssets must never be called."
        if grep -rn "deleteAssets" Sources/ ; then
          echo "ERROR: deleteAssets API call detected! Non-destructive policy violated."
          exit 1
        else
          echo "SUCCESS: Non-destructive architectural invariant verified."
        fi

    - name: Verify Real Vision Engine Is Wired
      run: |
        echo "Verifying VNGenerateImageFeaturePrintRequest is present (real AI, not fake engine)."
        if ! grep -rn "VNGenerateImageFeaturePrintRequest" Sources/ ; then
          echo "ERROR: Real Vision analysis not found — fake engine may have been reverted."
          exit 1
        else
          echo "SUCCESS: VNGenerateImageFeaturePrintRequest confirmed in codebase."
        fi

    - name: Create IPA Package
      run: |
        rm -rf Payload AlbumCurator-iOS.ipa
        mkdir -p Payload
        cp -R .build/derivedData/Build/Products/Release-iphoneos/AlbumCurator.app Payload/
        zip -r AlbumCurator-iOS.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: AlbumCurator-IPA-${{ env.IPA_SIGNED == 'true' && 'signed' || 'unsigned' }}
        path: AlbumCurator-iOS.ipa
        retention-days: 7
