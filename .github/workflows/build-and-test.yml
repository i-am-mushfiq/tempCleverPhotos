name: Build & Test Album Curator (iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build Swift Package & Executable (macOS Host & Tests)
      run: |
        swift build -c release -v
        swift test -v

    - name: Build iOS Target Executable
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        swift build -c release --sdk "$SDK_PATH" --triple arm64-apple-ios17.0 -v

    - name: Verify Safety Invariant (No Asset Deletion API)
      run: |
        echo "Verifying safety invariant: PHAssetChangeRequest.deleteAssets must never be called."
        if grep -rn "deleteAssets" Sources/ ; then
          echo "ERROR: deleteAssets API call detected! Non-destructive policy violated."
          exit 1
        else
          echo "SUCCESS: Non-destructive architectural invariant verified."
        fi

    - name: Create IPA Package
      run: |
        rm -rf Payload AlbumCurator-iOS.ipa
        mkdir -p Payload/AlbumCurator.app
        cp -R .build/arm64-apple-ios17.0/release/AlbumCurator Payload/AlbumCurator.app/ 2>/dev/null || cp -R .build/*/release/AlbumCurator Payload/AlbumCurator.app/ 2>/dev/null || true
        cat << 'EOF' > Payload/AlbumCurator.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>AlbumCurator</string>
            <key>CFBundleIdentifier</key>
            <string>com.example.AlbumCurator</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>AlbumCurator</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleSupportedPlatforms</key>
            <array>
                <string>iPhoneOS</string>
            </array>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
                <integer>2</integer>
            </array>
        </dict>
        </plist>
        EOF
        echo -n "APPL????" > Payload/AlbumCurator.app/PkgInfo
        zip -r AlbumCurator-iOS.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: AlbumCurator-IPA
        path: AlbumCurator-iOS.ipa
        retention-days: 7
